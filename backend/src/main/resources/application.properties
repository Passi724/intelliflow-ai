spring.application.name=backend

# PostgreSQL connection - matches docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/intelliflow_db
spring.datasource.username=intelliflow
spring.datasource.password=intelliflow_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port
server.port=8080