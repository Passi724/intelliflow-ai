spring.application.name=backend

# PostgreSQL connection - matches docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/intelliflow_db
spring.datasource.username=intelliflow
spring.datasource.password=intelliflow_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port - Render (and most PaaS hosts) inject PORT at runtime; Spring
# Boot only auto-binds SERVER_PORT, so this explicit placeholder is required.
server.port=${PORT:8080}

# JWT
app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-256-bits-for-security-9f8a7d6c5b4e3f2a1
app.jwt.expiration-ms=86400000

# CORS - Next.js dev server
app.cors.allowed-origins=http://localhost:3000

# MinIO - matches docker-compose.yml
app.minio.endpoint=http://localhost:9000
app.minio.access-key=intelliflow_admin
app.minio.secret-key=intelliflow_dev_password
app.minio.bucket=intelliflow-documents

# File upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# AI service
app.ai-service.url=http://localhost:8000