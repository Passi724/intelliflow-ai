services:
  postgres:
    image: postgres:16
    container_name: intelliflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intelliflow
      POSTGRES_PASSWORD: intelliflow_dev_password
      POSTGRES_DB: intelliflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: intelliflow-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: intelliflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: intelliflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: intelliflow_admin
      MINIO_ROOT_PASSWORD: intelliflow_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data: